events {}

http {
    # limit auth requests
    map "$request_method:$uri" $perga_login_limit_key {
        default "";
        ~^POST:/api/v1/auth/(access_token|access_token_json|google)/?$ $binary_remote_addr;
    }
    map "$request_method:$uri" $perga_signup_limit_key {
        default "";
        ~^POST:/api/v1/auth/signup/?$ $binary_remote_addr;
    }
    limit_req_zone $perga_login_limit_key zone=perga_login:1m rate=10r/m;
    limit_req_zone $perga_signup_limit_key zone=perga_signup:1m rate=5r/m;
    limit_req_status 429;

    default_type application/octet-stream;

    types {
        text/css css;
        text/javascript js;
        application/javascript js;
        image/svg+xml svg;
        text/html html;
        text/plain txt;
    }

    server {
        listen 80;
        limit_req zone=perga_login burst=10 nodelay;
        limit_req zone=perga_signup burst=5 nodelay;
        error_page 429 = @auth_rate_limited;

        location @auth_rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"detail":"Too many authentication requests"}';
        }

        client_max_body_size 11m;

        location /health/ {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
